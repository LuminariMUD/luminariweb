<VirtualHost 74.208.126.44:443>
    ServerName mud-origin.luminarimud.com
    DocumentRoot /var/lib/luminari-status

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/mud-origin.luminarimud.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mud-origin.luminarimud.com/privkey.pem

    # Require the client identity in the initial handshake so TLS 1.3 never
    # depends on per-location renegotiation or an unauthenticated pooled
    # connection. Public health state is served by the separate status vhost.
    SSLVerifyClient require
    SSLVerifyDepth 1
    SSLCACertificateFile /etc/stunnel/luminari-worker-client-ca.pem
    SSLCARevocationFile /etc/stunnel/luminari-worker-client-crl.pem
    SSLCARevocationCheck leaf

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPassMatch "^/gateway/(ws)$" "http://127.0.0.1:5191/$1" upgrade=websocket timeout=3700
    ProxyPassReverse "/gateway/ws" "http://127.0.0.1:5191/ws"

    <LocationMatch "^/gateway/ws$">
        SSLRequireSSL
        Require expr "%{SSL_CLIENT_VERIFY} == 'SUCCESS'"
    </LocationMatch>

    <Directory /var/lib/luminari-status>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog /var/log/apache2/luminari-mud-origin-status-error.log
    CustomLog /var/log/apache2/luminari-mud-origin-status-access.log "%a %t \"%r\" %>s %B ssl_client_verify=%{SSL_CLIENT_VERIFY}x"
</VirtualHost>
