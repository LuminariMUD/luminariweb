<VirtualHost 74.208.126.44:80>
    ServerName mud-status.luminarimud.com
    DocumentRoot /var/lib/luminari-acme

    <Directory /var/lib/luminari-acme>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://mud-status.luminarimud.com%{REQUEST_URI} [R=301,L]

    ErrorLog /var/log/apache2/luminari-mud-status-error.log
    CustomLog /var/log/apache2/luminari-mud-status-access.log combined
</VirtualHost>
